name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Check the legacy engine is not shipped
        run: |
          if grep -rl "combustion-processor" dist; then
            echo "The legacy (v15) worklet reached the build; see legacy/README.md" >&2
            exit 1
          fi

      - name: Unit and physics tests
        run: npx vitest run
